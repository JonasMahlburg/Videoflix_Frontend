<header>
    <a href="#landing-page"><img src="/icons/logo_icon.svg" alt="Logo"></a>
    
    <a 
      [ngClass]="isLoggedIn ? 'logOutBtn' : 'logInBtn'"
      [href]="isLoggedIn ? '#' : 'login'" 
      (click)="onButtonClick()" 
      rel="noopener noreferrer"
      class="logIn"
    >
        {{ isLoggedIn ? 'Logout' : 'Login' }}
    </a>
</header>
